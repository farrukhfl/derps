    <!-- Security & Bot Protection Meta Tags -->
    <!-- X-Content-Type-Options and Permissions-Policy are NOT part of the HTML spec's
         recognized http-equiv values, so no browser honors them via <meta> -- they are
         set as real HTTP response headers in public/.htaccess instead. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://dev-derps.gotmsolutions.com; object-src 'none'; base-uri 'self'" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Manrope:wght@600;700;800&amp;display=swap" rel="stylesheet" />
